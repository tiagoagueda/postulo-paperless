[project]
name = "postulo-paperless"
version = "0.3.0"
description = "Keep every document Postulo holds — rendered CVs and letters, uploaded files — in a Paperless-ngx archive, filed by company, kind and application."
readme = "README.md"
requires-python = ">=3.12.4"
license = "AGPL-3.0-or-later"
authors = [{ name = "Tiago Agueda" }]
keywords = ["postulo", "plugin", "paperless", "paperless-ngx", "archive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
# httpx is what the requests go through, by way of Postulo's own client, which carries
# the instance's timeouts and destination policy. Postulo itself is not declared: a
# plugin runs inside Postulo's environment, and Postulo is not on PyPI.
dependencies = ["httpx>=0.28"]

[project.urls]
Homepage = "https://source.tiagoagueda.com/postulo/postulo-paperless"
"Postulo" = "https://source.tiagoagueda.com/postulo/postulo"
"Paperless-ngx" = "https://docs.paperless-ngx.com/"
"Writing a plugin" = "https://source.tiagoagueda.com/postulo/postulo/src/branch/main/docs/PLUGINS.md"

# The installation, in full: Postulo reads this group when it starts and the store
# appears under Settings → Connections.
[project.entry-points."postulo.stores"]
paperless = "postulo_paperless.store:PaperlessStore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postulo_paperless"]
# The compiled catalogues: not committed (a translation arriving from Weblate would
# leave a stale one behind), so `postulo-messages compile` writes them before the build
# and this puts them in the wheel, which leaves out what .gitignore names.
artifacts = ["src/postulo_paperless/locale/*/LC_MESSAGES/django.mo"]

[dependency-groups]
# Which Postulo this is developed and tested against, said out loud. Without a ref the lock
# quietly tracked whatever `main` was on the day somebody last ran `uv lock` -- a commit old
# enough to predate the catalogue tool, which is why the catalogue tests were skipping
# themselves in CI rather than running (#2). The lock beside this file carries the exact
# commit, so a run is reproducible; the ref is what a deliberate `uv lock --upgrade` follows.
#
# The ref is a full commit of the core's `main`, because the core cuts no tag the plugin surface
# this package imports is in (#215, #216). Move it with `uv lock --upgrade`, and let the audit job
# in `.forgejo/workflows/ci.yml` say when the lock's dependencies have drifted (#17).
dev = [
    "postulo @ git+https://source.tiagoagueda.com/postulo/postulo.git@42be52048214fd98ed96d881fdf9fbadc10c4b73",
    "pytest>=8.3",
    "pytest-django>=4.14",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
# The release gate: the twenty-four European Union catalogues complete, run before a tag
# with `uv run pytest -m release`. Postulo's own gate cannot see a plugin's catalogues,
# so each plugin holds its own (postulo/postulo#187).
addopts = "--strict-markers -m 'not release'"
markers = [
    "release: a promise that must hold in a published version, not in every commit",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
