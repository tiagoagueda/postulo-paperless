name: Feature request
about: Ask for something the Paperless-ngx archive does not do yet.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Write in whatever language you can; English is easiest for the maintainer to act on.

        Describe the problem before the solution: a feature is judged by the problem it removes. Do not paste personal details such as a CV, an address or the name of somebody you applied to.
  - type: textarea
    id: problem
    attributes:
      label: The problem, and who has it
      description: What gets in the way, for whom, and how often.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Other ways to solve it, and what you do today.
  - type: dropdown
    id: scope
    attributes:
      label: Where it belongs
      description: If the core's plugin surface has to offer something first, the core gets an issue of its own.
      options:
        - In this plugin
        - It needs something from the core's plugin surface first (postulo/postulo)
        - Not sure
    validations:
      required: true
